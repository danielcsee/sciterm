# Datastores only. The API and UI run on the host in dev (scripts/dev.sh);
# the `api` service below is for running the built image instead.
services:
  postgres:
    # pgvector image so the extension is available when we add embeddings.
    image: pgvector/pgvector:pg17
    container_name: sciterm-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sciterm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sciterm}
      POSTGRES_DB: ${POSTGRES_DB:-sciterm}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sciterm} -d ${POSTGRES_DB:-sciterm}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis-celery-broker:
    image: redis:7-alpine
    container_name: sciterm-redis-celery-broker
    # Three tenants, not one -- the name says "broker" because that is the
    # largest, but read this before treating it as only that:
    #   db0  Celery's broker queues, AND the `ncbi:ratelimit` key that holds
    #        the 3/s NCBI budget shared by every process
    #   db1  Celery's result backend
    # The rate-limit key is the reason this instance cannot simply be swapped
    # for a per-service broker: split it and the 3/s becomes 3/s *each*.
    #
    # Queue state is reconstructible from paper_stage_runs, so persistence is
    # deliberately off. Eviction is off too (Redis defaults to noeviction) and
    # must stay off: Celery's queue lists carry no TTL, so an evicting policy
    # here would silently drop queued tasks.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-cache:
    image: redis:7-alpine
    container_name: sciterm-redis-cache
    # A SEPARATE instance from the broker above, on purpose. maxmemory and the
    # eviction policy are per-instance, not per-database, so a cache sharing the
    # broker's Redis could evict queued Celery tasks -- silently, since Celery's
    # queue lists carry no TTL and nothing reports an eviction. Isolated here,
    # `allkeys-lru` can only ever discard cached documents, and every miss just
    # re-fetches from PubTator.
    command: ["redis-server", "--save", "", "--appendonly", "no",
              "--maxmemory", "1gb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_CACHE_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Not started by dev.sh. Use `docker compose --profile app up --build api`
  # to run the packaged image (FastAPI serving the compiled UI bundle).
  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sciterm-api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sciterm}:${POSTGRES_PASSWORD:-sciterm}@postgres:5432/${POSTGRES_DB:-sciterm}
      CELERY_BROKER_URL: redis://redis-celery-broker:6379/0
      CELERY_RESULT_BACKEND: redis://redis-celery-broker:6379/1
      REDIS_CACHE_URL: redis://redis-cache:6379/0
      # The packaged image is what gets deployed, so it runs gated. JWT_SECRET
      # has no default on purpose: the app refuses to start without one.
      SCITERM_ENV: ${SCITERM_ENV:-prod}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET before running the app profile}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis-celery-broker:
        condition: service_healthy
      redis-cache:
        condition: service_healthy

volumes:
  postgres_data:
